<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NURSEED | منصة التوعية الصحية</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body class="landing-body">

    <div class="landing-container">
        <div class="logo-area">
            <!-- هنا تحطين شعار المنصة أو الكلية -->
            <img src="logo.png" alt="شعار المنصة" class="landing-logo" onerror="this.style.display='none'">
            <h1 class="landing-title">NURSEED</h1>
            <p class="landing-subtitle">منصة التوعية الصحية الرقمية</p>
        </div>
        
        <div class="landing-content">
            <h2>مرحباً بك في رحلتك التعليمية</h2>
            <p>منصة متخصصة في التوعية الصحية للمرأة. يرجى إدخال اسمك واختيار صفتك للبدء.</p>
            
            <!-- فورم التسجيل -->
            <div class="login-form">
                <input type="text" id="userNameInput" placeholder="اكتب اسمك الكريم هنا..." required>
                
                <select id="userRoleInput">
                    <option value="طالب/طالبة">طالب / طالبة</option>
                    <option value="طبيب/طبيبة">طبيب / طبيبة</option>
                    <option value="ممرض/ممرضة">ممرض / ممرضة</option>
                    <option value="تدريسي/تدريسية">تدريسي / تدريسية</option>
                    <option value="مهندس/مهندسة">مهندس / مهندسة</option>
                    <option value="زائر/زائرة">زائر / زائرة</option>
                </select>

                <button class="main-btn" onclick="saveUserAndEnter()">الدخول إلى قسم تكيس المبايض</button>
            </div>
        </div>
    </div>

    <script>
        function saveUserAndEnter() {
            const name = document.getElementById('userNameInput').value;
            const role = document.getElementById('userRoleInput').value;

            if (name.trim() === "") {
                alert("الرجاء إدخال اسمك أولاً!");
                return;
            }

            // حفظ الاسم والصفة في ذاكرة المتصفح
            localStorage.setItem('userName', name);
            localStorage.setItem('userRole', role);

            // الانتقال لصفحة الوحدات
            window.location.href = "pmos.html";
        }
    </script>
</body>
</html>
