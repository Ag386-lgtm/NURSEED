<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NURSEED | تسجيل الدخول</title>
    <link rel="stylesheet" href="style_v2.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
    
    <!-- 🔥 ربط Firebase (مدمج مباشرة) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCoDLpvPnJ58aL8-pHwHtMBMgRdZY6NVgU",
            authDomain: "nurseed-c2aa4.firebaseapp.com",
            projectId: "nurseed-c2aa4",
            storageBucket: "nurseed-c2aa4.firebasestorage.app",
            messagingSenderId: "593899467317",
            appId: "1:593899467317:web:ee5a1e029f0afeee70b77c"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // دالة مخصصة للإرسال في الخلفية
        window.sendDataToFirebase = async function(data) {
            try {
                await addDoc(collection(db, "nurseed_data"), data);
                console.log("✅ تم الإرسال إلى Firebase بنجاح!");
            } catch (error) {
                console.error("❌ خطأ في الإرسال: ", error);
            }
        }
    </script>
</head>
<body class="landing-body">

    <div class="landing-container">
        <div class="logo-area">
            <h1 class="landing-title">NURSEED</h1>
            <p class="landing-subtitle">Digital Health Awareness & Nursing Education Platform</p>
        </div>
        
        <div class="landing-content">
            <h2>مرحباً بك، يرجى إكمال بياناتك للبدء</h2>
            
            <!-- تم إزالة action الخاص بـ Pageclip، أصبح النموذج عادياً -->
            <div class="login-form">
                <input type="text" id="fullNameInput" placeholder="الاسم الثلاثي (الاسم الأول، الأب، الجد)" required>
                
                <select id="userRoleInput">
                    <option value="" disabled selected>اختر الصفة الحالية...</option>
                    <option value="طالب جامعي">طالب جامعي</option>
                    <option value="طالبة جامعية">طالبة جامعية</option>
                    <option value="طالب مدرسي">طالب مدرسي</option>
                    <option value="طالبة مدرسية">طالبة مدرسية</option>
                    <option value="خريج جامعي">خريج جامعي</option>
                    <option value="خريجة جامعية">خريجة جامعية</option>
                    <option value="موظف">موظف</option>
                    <option value="موظفة">موظفة</option>
                    <option value="متقاعد">متقاعد</option>
                    <option value="متقاعدة">متقاعدة</option>
                    <option value="عمل حر">عمل حر</option>
                    <option value="باحث أكاديمي">باحث أكاديمي</option>
                    <option value="باحثة أكاديمية">باحثة أكاديمية</option>
                    <option value="ربة منزل">ربة منزل</option>
                    <option value="بدون عمل حالياً">بدون عمل حالياً</option>
                    <option value="أخرى">أخرى</option>
                </select>

                <input type="email" id="userEmail" placeholder="البريد الإلكتروني" required>
                <input type="password" id="userPassword" placeholder="كلمة المرور" required>

                <button class="main-btn" onclick="loginOrRegister()">الدخول إلى المنصة</button>
            </div>
        </div>
    </div>

    <script>
        function loginOrRegister() {
            const fullName = document.getElementById('fullNameInput').value.trim();
            const role = document.getElementById('userRoleInput').value;
            const email = document.getElementById('userEmail').value.trim();
            const password = document.getElementById('userPassword').value;

            // 1. التحقق من البيانات
            if (fullName === "" || fullName.split(' ').length < 3) {
                alert("الرجاء إدخال الاسم الثلاثي كاملاً!");
                return;
            }
            if (role === "") {
                alert("الرجاء اختيار الصفة الحالية!");
                return;
            }
            if (email === "" || !email.includes('@')) {
                alert("الرجاء إدخال بريد إلكتروني صحيح!");
                return;
            }
            if (password.length < 4) {
                alert("كلمة المرور يجب أن تكون 4 أحرف على الأقل!");
                return;
            }

            // 2. إرسال البيانات إلى Firebase (في الخلفية)
            if(window.sendDataToFirebase) {
                window.sendDataToFirebase({ 
                    action: "تسجيل مستخدم جديد", 
                    fullName: fullName, 
                    role: role, 
                    email: email, 
                    date: new Date().toISOString() 
                });
            }

            // 3. حفظ بيانات المستخدم في المتصفح
            localStorage.setItem('userFullName', fullName);
            localStorage.setItem('userRole', role);
            localStorage.setItem('currentEmail', email);
            
            // تصفير التقدم القديم
            localStorage.removeItem('surveyDone');
            localStorage.removeItem('surveyAnswers');
            localStorage.removeItem('preTests');
            localStorage.removeItem('postTests');
            localStorage.removeItem('pmos_completed');

            // 4. الانتقال للصفحة التالية (دون انتظار رد Firebase لتجنب التعليق)
            window.location.href = "welcome.html";
        }
    </script>
</body>
</html>
