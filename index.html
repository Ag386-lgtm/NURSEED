<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NURSEED | تسجيل الدخول</title>
    <link rel="stylesheet" href="style_v2.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
    
    <!-- كود Pageclip Step 2 (الستايل) -->
    <link rel="stylesheet" href="https://s.pageclip.co/v1/pageclip.css" media="screen">
</head>
<body class="landing-body">

    <div class="landing-container">
        <div class="logo-area">
            <h1 class="landing-title">NURSEED</h1>
            <p class="landing-subtitle">Digital Health Awareness & Nursing Education Platform</p>
        </div>
        
        <div class="landing-content">
            <h2>مرحباً بك، يرجى إكمال بياناتك للبدء</h2>
            
            <!-- تم تحويل الـ div إلى form ليتوافق مع Pageclip -->
            <form class="login-form pageclip-form" 
                  action="https://send.pageclip.co/YOUR_PAGECLIP_KEY" 
                  method="post" 
                  id="loginForm">
                  
                <input type="text" id="fullNameInput" name="fullName" placeholder="الاسم الثلاثي (الاسم الأول، الأب، الجد)" required>
                
                <select id="userRoleInput" name="role">
                    <option value="" disabled selected>اختر الصفة الحالية...</option>
                    <option value="طالب جامعي">طالب جامعي</option>
                    <option value="طالبة جامعية">طالبة جامعية</option>
                    <option value="طالب مدرسي">طالب مدرسي</option>
                    <option value="طالبة مدرسية">طالبة مدرسية</option>
                    <option value="خريج جامعي">خريج جامعي</option>
                    <option value="خريجة جامعية">خريجة جامعية</option>
                    <option value="موظف">موظف</option>
                    <option value="موظفة">موظفة</option>
                    <option value="متقاعد">متقاعد</option>
                    <option value="متقاعدة">متقاعدة</option>
                    <option value="عمل حر">عمل حر</option>
                    <option value="باحث أكاديمي">باحث أكاديمي</option>
                    <option value="باحثة أكاديمية">باحثة أكاديمية</option>
                    <option value="ربة منزل">ربة منزل</option>
                    <option value="بدون عمل حالياً">بدون عمل حالياً</option>
                    <option value="أخرى">أخرى</option>
                </select>

                <input type="email" id="userEmail" name="email" placeholder="البريد الإلكتروني" required>
                <input type="password" id="userPassword" name="password" placeholder="كلمة المرور" required>

                <!-- زر الإرسال الخاص بـ Pageclip -->
                <button type="submit" class="main-btn pageclip-form__submit" style="position: relative;">
                    <span>الدخول إلى المنصة</span>
                </button>
            </form>
            
        </div>
    </div>

    <!-- كود Pageclip Step 1 (السكربت الأساسي) -->
    <script src="https://s.pageclip.co/v1/pageclip.js" charset="utf-8"></script>

    <!-- سكربت مخصص للتحقق من البيانات وتوجيه المستخدم -->
    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            // التحقق من إدخال الاسم الثلاثي
            const fullName = document.getElementById('fullNameInput').value.trim();
            if (fullName === "" || fullName.split(' ').length < 3) {
                e.preventDefault(); // إيقاف الإرسال
                alert("الرجاء إدخال الاسم الثلاثي كاملاً!");
                return;
            }

            // التحقق من كلمة المرور
            const password = document.getElementById('userPassword').value;
            if (password.length < 4) {
                e.preventDefault();
                alert("كلمة المرور يجب أن تكون 4 أحرف على الأقل!");
                return;
            }

            // إذا كانت البيانات صحيحة، نسمح لـ Pageclip بالإرسال في الخلفية
            // ونقوم بحفظ البيانات محلياً ونقل المستخدم فوراً
            setTimeout(() => {
                const role = document.getElementById('userRoleInput').value;
                const email = document.getElementById('userEmail').value.trim();
                
                localStorage.setItem('userFullName', fullName);
                localStorage.setItem('userRole', role);
                localStorage.setItem('currentEmail', email);
                
                // تصفير البيانات القديمة للمستخدم الجديد
                localStorage.removeItem('surveyDone');
                localStorage.removeItem('surveyAnswers');
                localStorage.removeItem('preTests');
                localStorage.removeItem('postTests');
                localStorage.removeItem('pmos_completed');

                // الانتقال لصفحة الترحيب
                window.location.href = "welcome.html";
            }, 1000); // انتظار ثانية واحدة لضمان وصول البيانات لـ Pageclip
        });
    </script>
</body>
</html>
