<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NURSEED | تسجيل الدخول</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="style_v2.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCoDLpvPnJ58aL8-pHwHtMBMgRdZY6NVgU",
            authDomain: "nurseed-c2aa4.firebaseapp.com",
            projectId: "nurseed-c2aa4",
            storageBucket: "nurseed-c2aa4.firebasestorage.app",
            messagingSenderId: "593899467317",
            appId: "1:593899467317:web:ee5a1e029f0afeee70b77c"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.getUserFromFirebase = async function(email) {
            try {
                const safeEmail = email.replace(/\./g, '_').replace(/@/g, '_at_'); 
                const docRef = doc(db, "nurseed_accounts", safeEmail);
                const docSnap = await getDoc(docRef);
                return docSnap.exists() ? docSnap.data() : null;
            } catch (e) { console.error(e); return null; }
        }

        window.saveUserToFirebase = async function(userData) {
            try {
                const safeEmail = userData.email.replace(/\./g, '_').replace(/@/g, '_at_');
                const docRef = doc(db, "nurseed_accounts", safeEmail);
                await setDoc(docRef, userData, { merge: true });
            } catch (error) { console.error(error); }
        }
    </script>
</head>
<body class="landing-body">

    <div class="landing-container">
        <div class="logo-area">
            <h1 class="landing-title">NURSEED</h1>
            <p class="landing-subtitle">Digital Health Awareness & Nursing Education Platform</p>
        </div>
        
        <div class="landing-content">
            <h2>مرحباً بك، يرجى إكمال بياناتك للبدء</h2>
            
            <div class="login-form">
                <input type="text" id="fullNameInput" placeholder="الاسم الثلاثي (الاسم الأول، الأب، الجد)">
                <select id="userRoleInput">
                    <option value="" disabled selected>اختر الصفة الحالية...</option>
                    <option value="طالب جامعي">طالب جامعي</option>
                    <option value="طالبة جامعية">طالبة جامعية</option>
                    <option value="خريج جامعي">خريج جامعي</option>
                    <option value="خريجة جامعية">خريجة جامعية</option>
                    <option value="موظف">موظف</option>
                    <option value="موظفة">موظفة</option>
                    <option value="باحث أكاديمي">باحث أكاديمي</option>
                    <option value="باحثة أكاديمية">باحثة أكاديمية</option>
                    <option value="أخرى">أخرى</option>
                </select>
                <input type="email" id="userEmail" placeholder="البريد الإلكتروني" required>
                <input type="password" id="userPassword" placeholder="كلمة المرور" required>
                <button class="main-btn" onclick="loginOrRegister()">الدخول إلى المنصة</button>
            </div>
        </div>
    </div>

    <script>
        window.onload = function() {
            if (localStorage.getItem('currentEmail')) {
                window.location.href = "welcome.html";
                return;
            }
            const savedName = localStorage.getItem('userFullName');
            const savedRole = localStorage.getItem('userRole');
            const savedEmail = localStorage.getItem('currentEmail');
            if (savedName) document.getElementById('fullNameInput').value = savedName;
            if (savedRole) document.getElementById('userRoleInput').value = savedRole;
            if (savedEmail) document.getElementById('userEmail').value = savedEmail;
        };

        async function loginOrRegister() {
            const fullName = document.getElementById('fullNameInput').value.trim();
            const role = document.getElementById('userRoleInput').value;
            const email = document.getElementById('userEmail').value.trim();
            const password = document.getElementById('userPassword').value;
            
            if (email === "" || !email.includes('@')) { alert("الرجاء إدخال بريد إلكتروني صحيح!"); return; }
            if (password.length < 4) { alert("كلمة المرور يجب أن تكون 4 أحرف على الأقل!"); return; }

            const existingUser = await window.getUserFromFirebase(email);

            if (existingUser) {
                if (existingUser.password !== password) { alert("كلمة المرور غير صحيحة!"); return; }
                
                localStorage.setItem('userFullName', existingUser.fullName); 
                localStorage.setItem('userRole', existingUser.role);
                localStorage.setItem('currentEmail', email);
                localStorage.setItem('userPassword', password); // نحفظ الباسورد لعرضه في حسابي
                
                if (existingUser.surveyDone) localStorage.setItem('surveyDone', existingUser.surveyDone);
                if (existingUser.surveyAnswers) localStorage.setItem('surveyAnswers', JSON.stringify(existingUser.surveyAnswers));
                if (existingUser.preTests) localStorage.setItem('preTests', JSON.stringify(existingUser.preTests));
                if (existingUser.postTests) localStorage.setItem('postTests', JSON.stringify(existingUser.postTests));
                if (existingUser.pmos_completed) localStorage.setItem('pmos_completed', JSON.stringify(existingUser.pmos_completed));
                if (existingUser.attitudeDone) localStorage.setItem('attitudeDone', existingUser.attitudeDone);
                
                window.location.href = "welcome.html";
            } else {
                if (fullName === "" || fullName.split(' ').length < 3) { alert("أنت مستخدم جديد. الرجاء إدخال الاسم الثلاثي كاملاً!"); return; }
                if (role === "") { alert("الرجاء اختيار الصفة الحالية!"); return; }

                const newUser = { 
                    fullName: fullName, role: role, email: email, password: password, 
                    date: new Date().toISOString(), surveyDone: 'false', surveyAnswers: {},
                    preTests: {}, postTests: {}, pmos_completed: [], attitudeDone: 'false'
                };
                await window.saveUserToFirebase(newUser);

                localStorage.setItem('userFullName', fullName);
                localStorage.setItem('userRole', role);
                localStorage.setItem('currentEmail', email);
                localStorage.setItem('userPassword', password);
                localStorage.setItem('surveyDone', 'false');
                localStorage.setItem('surveyAnswers', '{}');
                localStorage.setItem('preTests', '{}');
                localStorage.setItem('postTests', '{}');
                localStorage.setItem('pmos_completed', '[]');
                localStorage.setItem('attitudeDone', 'false');

                alert("تم إنشاء حسابك بنجاح!");
                window.location.href = "welcome.html";
            }
        }
    </script>
</body>
</html>
