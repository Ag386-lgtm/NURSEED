<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شهادتي | NURSEED</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="style_v2.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <style>
        .certificate-wrapper {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .cert-image-container {
            position: relative;
            width: 100%;
            max-width: 950px; /* عرض الشهادة */
            aspect-ratio: 1.5 / 1; /* نسبة أبعاد صورتك 1500x1000 */
            background-image: url('cert-bg.png'); /* تأكد من اسم الصورة */
            background-size: 100% 100%; /* لضمان ملء الصورة بالكامل */
            background-position: center;
            background-repeat: no-repeat;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            overflow: hidden;
        }
        
        /* تنسيق النصوص - تم ضبطها هندسياً لتطابق المربعات الفارغة في صورتك */
        .cert-name { 
            position: absolute; 
            top: 43.5%; /* المربع الفارغ الكبير في الوسط */
            left: 50%; 
            transform: translateX(-50%); 
            width: 65%; 
            text-align: center; 
            font-size: 2.4em; 
            font-weight: 900; 
            color: #4a148c; 
            font-family: 'Cairo', sans-serif; 
            white-space: nowrap; 
            z-index: 10;
        }
        .cert-score { 
            position: absolute; 
            top: 76.5%; /* المربع الصغير بجانب الكأس */
            left: 53.5%; 
            transform: translateX(-50%); 
            font-size: 1.6em; 
            font-weight: 900; 
            color: #4a148c; 
            font-family: 'Cairo', sans-serif; 
            z-index: 10;
        }
        .cert-date { 
            position: absolute; 
            bottom: 9%; /* أسفل اليمين */
            right: 9%; 
            font-size: 1.1em; 
            font-weight: 700; 
            color: #4a148c; 
            z-index: 10;
        }
        .cert-role { 
            position: absolute; 
            bottom: 9%; /* أسفل اليسار */
            left: 9%; 
            font-size: 1.1em; 
            font-weight: 700; 
            color: #4a148c; 
            z-index: 10;
        }

        .actions { text-align: center; margin-top: 20px; display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; margin-bottom: 40px; }
        .actions button { width: auto; padding: 12px 30px; cursor: pointer; border: none; border-radius: 8px; font-family: 'Cairo'; font-weight: bold; font-size: 1.1em; transition: 0.3s; display: flex; align-items: center; gap: 10px; }
        .btn-download { background: var(--success); color: white; }
        .btn-share { background: var(--primary); color: white; }
    </style>
</head>
<body class="dashboard-body">

    <button class="toggle-sidebar" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>

    <aside class="sidebar" id="sidebar">
        <div class="sidebar-logo"><h2>NURSEED</h2><p>Learn • Care • Heal</p></div>
        <nav class="sidebar-nav">
            <a href="welcome.html"><i class="fas fa-home"></i> الرئيسية</a>
            <a href="pmos.html"><i class="fas fa-graduation-cap"></i> مساري التعليمي</a>
            <a href="#" onclick="toggleDarkMode()"><i class="fas fa-moon"></i> تغيير المظهر</a>
            <a href="results.html"><i class="fas fa-chart-bar"></i> نتائجي</a>
            <a href="certificates.html" class="active"><i class="fas fa-certificate"></i> شهاداتي</a>
            <a href="#" onclick="logout()" style="color: #ff5252;"><i class="fas fa-sign-out-alt"></i> تسجيل الخروج</a>
        </nav>
    </aside>

    <main class="main-content">
        <div class="certificate-wrapper">
            <div id="certificateArea" class="cert-image-container">
                <div class="cert-name" id="studentName">جاري التحميل...</div>
                <div class="cert-score" id="studentScore">0 / 0</div>
                <div class="cert-date" id="certDate"></div>
                <div class="cert-role" id="studentRole"></div>
            </div>
        </div>

        <div class="actions">
            <button class="btn-download" onclick="downloadCertificate()"><i class="fas fa-download"></i> تحميل الشهادة</button>
            <button class="btn-share" onclick="shareCertificate()"><i class="fas fa-share-alt"></i> مشاركة</button>
        </div>
    </main>

    <script>
        function logout() { localStorage.clear(); window.location.href = "index.html"; }
        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('active'); }
        function toggleDarkMode() { document.body.classList.toggle('dark-mode'); }

        window.onload = function() {
            const name = localStorage.getItem('userFullName');
            const role = localStorage.getItem('userRole');
            const completed = JSON.parse(localStorage.getItem('pmos_completed')) || [];
            const postTests = JSON.parse(localStorage.getItem('postTests')) || {};
            const isAttitudeDone = localStorage.getItem('attitudeDone') === 'true';

            if (completed.length < 6 || !isAttitudeDone) {
                alert("يجب إكمال الوحدات وأسئلة الاتجاهات أولاً.");
                window.location.href = "pmos.html";
                return;
            }

            document.getElementById('studentName').innerText = name || "طالب غير معروف";
            document.getElementById('studentRole').innerText = role || "طالب";
            
            let totalScore = 0; let totalQuestions = 0;
            for (let i = 1; i <= 6; i++) { if (postTests[i]) { totalScore += postTests[i].score; totalQuestions += postTests[i].total; } }
            document.getElementById('studentScore').innerText = `${totalScore} / ${totalQuestions}`;

            const today = new Date();
            document.getElementById('certDate').innerText = today.getFullYear() + "/" + (today.getMonth()+1) + "/" + today.getDate();
        }

        function downloadCertificate() {
            const cert = document.getElementById('certificateArea');
            html2canvas(cert, { scale: 2, backgroundColor: null, useCORS: true }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'NURSEED_Certificate.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            }).catch(err => alert("حدث خطأ أثناء تحميل الشهادة."));
        }

        function shareCertificate() {
            const name = localStorage.getItem('userFullName');
            const url = window.location.origin;
            if (navigator.share) {
                navigator.share({ title: 'شهادة إنجاز', text: `أنا ${name}، أتممت المسار التعليمي على منصة NURSEED!`, url: url }).catch(console.error);
            } else {
                navigator.clipboard.writeText(`أنا ${name}، أتممت المسار التعليمي على منصة NURSEED! ${url}`);
                alert("تم نسخ الرابط!");
            }
        }
    </script>
</body>
</html>
