<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شهادتي | NURSEED</title>
    
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="style_v2.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- مكتبة تحويل الشهادة لصورة -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <style>
        /* حاوية الشهادة (تعتمد على نسبة الصورة) */
        .cert-wrapper {
            position: relative;
            width: 100%;
            max-width: 900px;
            margin: 20px auto;
            aspect-ratio: 1.5 / 1; /* نسبة أبعاد الصورة اللي أرسلتها */
            background-image: url('cert-bg.png'); /* اسم صورتك هنا */
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }

        /* تنسيق النصوص فوق الصورة */
        .cert-name {
            position: absolute;
            top: 44.5%; /* مكان مستطيل الاسم */
            left: 50%;
            transform: translateX(-50%);
            width: 60%;
            text-align: center;
            font-size: 2.2em;
            font-weight: 900;
            color: #4a148c; /* لون بنفسجي غامق */
            font-family: 'Cairo', sans-serif;
            white-space: nowrap;
        }

        .cert-score {
            position: absolute;
            top: 72.5%; /* مكان النتيجة */
            left: 62%; 
            transform: translateX(-50%);
            font-size: 1.8em;
            font-weight: 900;
            color: #4a148c;
            font-family: 'Cairo', sans-serif;
        }

        .cert-date {
            position: absolute;
            bottom: 6%;
            right: 8%;
            font-size: 1.1em;
            font-weight: 700;
            color: #6a1b9a;
        }

        .cert-role {
            position: absolute;
            bottom: 6%;
            left: 8%;
            font-size: 1.1em;
            font-weight: 700;
            color: #6a1b9a;
        }

        /* أزرار التحميل والمشاركة */
        .actions {
            text-align: center;
            margin-top: 20px;
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 40px;
        }
        .actions button {
            width: auto;
            padding: 12px 30px;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            font-family: 'Cairo';
            font-weight: bold;
            font-size: 1.1em;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .btn-download { background: var(--success); color: white; }
        .btn-share { background: var(--primary); color: white; }
        .btn-download:hover, .btn-share:hover { opacity: 0.8; transform: translateY(-3px); }
    </style>
</head>
<body class="dashboard-body">

    <button class="toggle-sidebar" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>

    <aside class="sidebar" id="sidebar">
        <div class="sidebar-logo">
            <h2>NURSEED</h2>
            <p>Learn • Care • Heal</p>
        </div>
        <nav class="sidebar-nav">
            <a href="welcome.html"><i class="fas fa-home"></i> الرئيسية</a>
            <a href="pmos.html"><i class="fas fa-graduation-cap"></i> مساري التعليمي</a>
            <a href="#" onclick="toggleDarkMode()"><i class="fas fa-moon"></i> تغيير المظهر</a>
            <a href="results.html"><i class="fas fa-chart-bar"></i> نتائجي</a>
            <a href="certificates.html" class="active"><i class="fas fa-certificate"></i> شهاداتي</a>
            <a href="#" onclick="logout()" style="color: #ff5252;"><i class="fas fa-sign-out-alt"></i> تسجيل الخروج</a>
        </nav>
    </aside>

    <main class="main-content">
        
        <!-- الشهادة -->
        <div id="certificateArea" class="cert-wrapper">
            <div class="cert-name" id="studentName">جاري التحميل...</div>
            <div class="cert-score" id="studentScore">0 / 0</div>
            <div class="cert-date" id="certDate"></div>
            <div class="cert-role" id="studentRole"></div>
        </div>

        <!-- الأزرار -->
        <div class="actions">
            <button class="btn-download" onclick="downloadCertificate()"><i class="fas fa-download"></i> تحميل الشهادة</button>
            <button class="btn-share" onclick="shareCertificate()"><i class="fas fa-share-alt"></i> مشاركة</button>
        </div>
    </main>

    <script>
        function logout() {
            localStorage.clear();
            window.location.href = "index.html";
        }

        window.onload = function() {
            const name = localStorage.getItem('userFullName');
            const role = localStorage.getItem('userRole');
            const completed = JSON.parse(localStorage.getItem('pmos_completed')) || [];
            const postTests = JSON.parse(localStorage.getItem('postTests')) || {};
            const isAttitudeDone = localStorage.getItem('attitudeDone') === 'true';

            // التحقق من إكمال الوحدات وأسئلة الاتجاهات
            if (completed.length < 6 || !isAttitudeDone) {
                alert("يجب إكمال الوحدات وأسئلة الاتجاهات أولاً.");
                window.location.href = "pmos.html";
                return;
            }

            // اسم الطالب وصفته
            if(name && role) {
                document.getElementById('studentName').innerText = name;
                document.getElementById('studentRole').innerText = role;
            } else {
                window.location.href = "index.html";
                return;
            }

            // حساب النتيجة النهائية
            let totalScore = 0;
            let totalQuestions = 0;
            for (let i = 1; i <= 6; i++) {
                if (postTests[i]) {
                    totalScore += postTests[i].score;
                    totalQuestions += postTests[i].total;
                }
            }
            document.getElementById('studentScore').innerText = `${totalScore} / ${totalQuestions}`;

            // إضافة التاريخ
            const today = new Date();
            const dateStr = today.getFullYear() + "/" + (today.getMonth()+1) + "/" + today.getDate();
            document.getElementById('certDate').innerText = dateStr;
        }

        function downloadCertificate() {
            const certElement = document.getElementById('certificateArea');
            html2canvas(certElement, { scale: 2, backgroundColor: null, useCORS: true }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'NURSEED_Certificate.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            }).catch(err => {
                alert("حدث خطأ أثناء تحميل الشهادة. يرجى المحاولة مرة أخرى.");
                console.error(err);
            });
        }

        function shareCertificate() {
            const name = localStorage.getItem('userFullName');
            const platformUrl = window.location.origin; // ياخذ رابط الموقع تلقائياً
            const shareText = `أنا ${name}، أتممت بنجاح المسار التعليمي لمتلازمة تكيس المبايض الأيضي على منصة NURSEED! 🎓\nيمكنكم زيارة المنصة عبر الرابط:`;
            
            if (navigator.share) {
                navigator.share({ title: 'شهادة إنجاز من NURSEED', text: shareText, url: platformUrl }).catch(console.error);
            } else {
                navigator.clipboard.writeText(shareText + " " + platformUrl);
                alert("تم نسخ تفاصيل الشهادة ورابط المنصة بنجاح! يمكنك لصقها في أي مكان.");
            }
        }
    </script>
</body>
</html>
